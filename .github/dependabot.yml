version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    ignore:
      # PyMuPDF 2.x removes a retained character in the public-PDF layout check.
      - dependency-name: pymupdf
        update-types:
          - version-update:semver-major
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - '*'
      python-dependencies:
        patterns:
          - '*'

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit-hooks:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
