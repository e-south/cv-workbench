<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cv-workbench preview</title>
    <link rel="icon" href="data:," />
    <style>
{{CVW_PREVIEW_STYLE}}    </style>
  </head>
  <body tabindex="0" data-cvw-build-id="" data-cvw-session-id="" data-cvw-controller-state="active">
    <a class="skip-link" href="#preview-area">Skip to document</a>
    <div id="layout">
      <aside id="sidebar" aria-label="Preview controls">
        <header id="hero">
          <div>
            <div id="eyebrow">Local preview</div>
            <h1 id="brand">cv-workbench</h1>
          </div>
          <div id="status-pills">
            <span id="controller-pill" class="status-pill" data-cvw-status="controller-pill" data-cvw-state="active">Live</span>
            <span id="build-pill" class="status-pill" data-cvw-status="build-pill">Build pending</span>
          </div>
        </header>

        <div class="selection-grid">
          <label>
            <span>Project</span>
            <select id="project-select" data-cvw-control="project"></select>
          </label>
          <label>
            <span>Variant</span>
            <select id="variant-select" data-cvw-control="variant"></select>
          </label>
        </div>

        <div id="format-tabs" role="group" aria-label="Preview format" data-cvw-control="format-tabs">
          <button data-format="html" data-cvw-format="html" type="button">HTML</button>
          <button data-format="pdf" data-cvw-format="pdf" type="button">PDF</button>
          <button data-format="md" data-cvw-format="md" type="button">Markdown</button>
          <button data-format="ats" data-cvw-format="ats" type="button" aria-label="ATS plain text">ATS</button>
        </div>

        <details id="document-settings" class="section">
          <summary>Document settings</summary>
          <div class="settings-grid">
            <label>
              <span>Theme</span>
              <select id="theme-select" data-cvw-control="theme"></select>
            </label>
            <label>
              <span>Preset</span>
              <select id="preset-select" data-cvw-control="preset"></select>
            </label>
            <label class="toggle">
              <span>Rebuild PDF automatically</span>
              <input id="auto-pdf-toggle" data-cvw-control="auto-pdf" type="checkbox" />
            </label>
          </div>
        </details>

        <div id="preview-feedback">
          <div class="action-row">
            <button id="rebuild" data-cvw-action="rebuild" type="button">Rebuild</button>
            <button id="stop-preview" data-cvw-action="stop" type="button">Stop</button>
          </div>
          <div id="status" data-cvw-status="status" aria-live="polite">Listening for changes...</div>
          <div id="error" data-cvw-status="error" aria-live="polite"></div>
          <div id="project-warning" data-cvw-status="project-warning" aria-live="polite"></div>
        </div>

        <details id="preview-details" class="section">
          <summary>Build details</summary>
          <div class="details-content">
            <div id="summary" data-cvw-status="summary" aria-live="polite"></div>
            <section aria-labelledby="guidance-heading">
              <h2 class="section-title" id="guidance-heading">Project guidance</h2>
              <div id="project-guidance" data-cvw-status="project-guidance" aria-live="polite"></div>
            </section>
            <section aria-labelledby="runs-heading">
              <h2 class="section-title" id="runs-heading">Recent builds</h2>
              <div id="run-list" data-cvw-status="run-list" aria-live="polite"></div>
            </section>
            <div id="shortcuts">
              Keys:
              <kbd>t</kbd> theme
              <kbd>p</kbd> preset
              <kbd>v</kbd> variant
              <kbd>f</kbd> format
              <kbd>r</kbd> rebuild
              <kbd>x</kbd> stop
            </div>
          </div>
        </details>
      </aside>

      <main id="preview-area" tabindex="-1" aria-label="Document">
        <iframe id="preview" data-cvw-view="preview-frame" title="Document preview" src="about:blank"></iframe>
      </main>
    </div>
    <script>
{{CVW_PREVIEW_SCRIPT}}    </script>
  </body>
</html>
