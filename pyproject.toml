[project]
name = "cv-workbench"
version = "0.1.0"
description = "Deterministic CV/resume build engine"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "typer>=0.27.1",
  "pydantic>=2.13.4",
  "PyYAML>=6.0.1",
  "rich>=15.0.0",
  "trafilatura>=2.2.0",
  "pymupdf>=1.26,<2",
]

[dependency-groups]
dev = [
  "pre-commit>=4.6.2",
  "pytest>=8.0.0",
  "ruff>=0.16.1",
  "pip-audit>=2.9,<3",
]

[project.scripts]
cvw = "cvworkbench.cli:app"

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvworkbench"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
